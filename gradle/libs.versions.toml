[versions]
# Pinned to match the target project's buildSrc/dependencies.gradle so generated code
# is drop-in compatible with that project. flatc's own compiler version
# (pinned separately in flake.nix) must equal flatbuffersJava, since
# FlatBuffers releases flatc and every language runtime under one version.
kotlin = "1.9.0"
kotlinxCoroutines = "1.7.3"
kotlinpoet = "1.12.0"
flatbuffersJava = "25.2.10"
grpc = "1.70.0"
grpcKotlin = "1.2.1"
protobuf = "3.25.1"
javaxAnnotation = "1.3.2"
junit = "5.10.1"
truth = "1.4.0"
shadow = "8.1.1"
pluginPublish = "1.3.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
flatbuffers-java = { module = "com.google.flatbuffers:flatbuffers-java", version.ref = "flatbuffersJava" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version.ref = "javaxAnnotation" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
java-gradle-plugin = { id = "java-gradle-plugin" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }
