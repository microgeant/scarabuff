name: Publish Gradle plugin

# Push a tag like `v0.2.0` (matching `version` in gradle.properties) to publish that version to
# the Gradle Plugin Portal, then create its GitHub release. Requires repo secrets
# GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET (from https://plugins.gradle.org/u/<you> → API Keys).
#
# Before tagging: give the version's CHANGELOG.md entry a date, `## [0.5.0] - 2026-10-20`. It
# becomes the release notes, and the run stops before building if it's missing or undated.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches gradle.properties version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="$(grep -m1 "^## \[$version\] - " CHANGELOG.md || true)"
          if [ -z "$heading" ]; then
            echo "CHANGELOG.md has no '## [$version] - <date>' entry" >&2
            exit 1
          fi
          if echo "$heading" | grep -qi unreleased; then
            echo "CHANGELOG.md's entry for $version is still marked Unreleased; give it a date" >&2
            exit 1
          fi
          # The entry's body: everything up to the next version heading or the link list.
          awk -v heading="$heading" '
            $0 == heading { inside = 1; next }
            inside && (/^## \[/ || /^\[[0-9]/) { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: cachix/install-nix-action@v27

      # The devShell provides the pinned flatc, JDK 17 and $FLATC, same as local development.
      - name: Build and test
        run: |
          nix develop -c ./gradlew build
          nix develop -c bash -c 'cd example && ./gradlew test'
          nix develop -c ./gradlew :scarabuff-gradle-plugin:functionalTest

      - name: Publish to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: nix develop -c ./gradlew :scarabuff-gradle-plugin:publishPlugins

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "scarabuff ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
